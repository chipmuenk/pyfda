# Configuration file for logging
#
# The minimum logging level (DEBUG, INFO, WARNING, ERROR) needs to be set globally
# per logger (logfile, console and application window at the bottom of the file) AND
# for the module of interest. The higher of both levels determines which messages
# are displayed.
[loggers]
# List of loggers:
# - root logger has to be present
# - section name is "logger_" + name specified in the keys below. The logger
#   name is derived automatically in the files-to-be-logged from their
#  __name__ attribute (i.e. the file name without suffix)
#
# When a file doesn't exist (e.g. no_existo.py), nothing happens (no error message)
#
keys=root, config_file_parser, filter_factory, filterbroker, pyfda_class, pyfda_rc,
     pyfdax, tabbed_widget, tree_builder,
     # filter widgets
     equiripple, firwin,
     # fixpoint widgets
     fir_df_amaranth_mod, fir_df_amaranth_ui, fir_df_amaranth, fir_df_pyfixp_ui, fir_df_pyfixp,
     iir_df1_pyfixp_ui, iir_df1_pyfixp,
     fx_ui_wq,
     # input widgets
     amplitude_specs, freq_specs, freq_units, input_coeffs_ui, input_coeffs,
     input_fixpoint_specs, input_info_about, input_info, input_pz_ui, input_pz,
     input_specs, item_delegate_coeffs, item_delegate_pz,
     select_filter, target_specs, weight_specs,
     # libs
     csv_option_box, fft_windows_cmb_box, pyfda_fft_windows_lib, pyfda_fix_lib_amaranth,
     pyfda_fix_lib, pyfda_io_lib, pyfda_lib, pyfda_qt_classes, pyfda_qt_lib, pyfda_sig_lib,
     special_functions,
     # plot widgets
     mpl_widget, plot_3d, plot_fft_win, plot_hf, plot_impz, plot_impz_ui,
     plot_phi, plot_pz, plot_tau_g,
     plot_tran_stim, plot_tran_stim_ui, tran_io, tran_io_ui,
     # Test Case, file doesn't exist
     no_existo

[handlers]
# List of handlers
keys=consoleHandler,fileHandler,QHandler

[formatters]
# List of formatters
keys=simpleFormatter,noDateFormatter,ezFormatter

